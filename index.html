<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAZARD 69 - Official</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   ENTRY SCREEN
========================= */

#entryScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    overflow:hidden;
    background:#000;
}

/* PHOTO */

.entryPhoto{
    position:absolute;
    inset:-5%;
    width:110%;
    height:110%;

    object-fit:cover;
    object-position:center;

    filter:
        brightness(.48)
        contrast(1.2)
        saturate(1.15);

    animation:
        cinematicZoom 9s
        ease-out
        forwards;
}

@keyframes cinematicZoom{

    0%{
        transform:scale(1.08);
    }

    50%{
        transform:scale(1.16);
    }

    100%{
        transform:scale(1.03);
    }
}


/* DARK OVERLAY */

.darkOverlay{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 15%,
            rgba(0,0,0,.35) 50%,
            rgba(0,0,0,.88) 100%
        );
}


/* PURPLE LIGHT */

.lightEffect{
    position:absolute;
    width:500px;
    height:500px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(125,70,255,.28),
            transparent 65%
        );

    filter:blur(30px);

    animation:
        lightPulse 3s
        infinite
        ease-in-out;
}

@keyframes lightPulse{

    0%,100%{
        opacity:.45;
        transform:
            translate(-50%,-50%)
            scale(.8);
    }

    50%{
        opacity:.8;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}


/* =========================
   CONTENT
========================= */

.entryContent{

    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    z-index:5;
}


/* SMALL TEXT */

.welcome{

    font-size:13px;

    letter-spacing:7px;

    color:#d6d6d6;

    margin-bottom:15px;

    opacity:0;

    animation:
        fadeUp 1s
        .4s
        forwards;
}


/* TITLE */

.title{

    font-size:
        clamp(
            48px,
            13vw,
            125px
        );

    font-weight:1000;

    letter-spacing:
        clamp(
            5px,
            2vw,
            18px
        );

    color:white;

    text-shadow:
        0 0 15px
        rgba(145,80,255,.9),

        0 0 45px
        rgba(145,80,255,.6),

        0 0 90px
        rgba(145,80,255,.35);

    opacity:0;

    animation:
        titleReveal 1.5s
        .8s
        forwards;
}


.title span{
    color:#8b5cf6;
}


/* SUBTITLE */

.subtitle{

    margin-top:8px;

    font-size:
        clamp(
            12px,
            2vw,
            18px
        );

    letter-spacing:6px;

    color:#c5c5c5;

    opacity:0;

    animation:
        fadeUp 1s
        1.4s
        forwards;
}


/* ENTER BUTTON */

.enterButton{

    margin-top:42px;

    min-width:210px;

    padding:16px 30px;

    border-radius:50px;

    border:
        1px solid
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:15px;

    font-weight:bold;

    letter-spacing:3px;

    cursor:pointer;

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 0 30px
        rgba(123,78,255,.35);

    opacity:0;

    animation:
        fadeUp 1s
        1.9s
        forwards;

    transition:
        .3s;
}


.enterButton:hover{

    transform:
        scale(1.06);

    background:
        linear-gradient(
            135deg,
            #6847ff,
            #a855f7
        );

    box-shadow:
        0 0 50px
        rgba(139,92,246,.7);
}


/* =========================
   BOTTOM
========================= */

.footerText{

    position:absolute;

    bottom:25px;

    font-size:10px;

    letter-spacing:3px;

    color:
        rgba(255,255,255,.5);

    opacity:0;

    animation:
        fadeUp 1s
        2.3s
        forwards;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:
            translateY(25px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}


@keyframes titleReveal{

    0%{
        opacity:0;
        transform:
            scale(.7)
            translateY(25px);

        filter:
            blur(15px);
    }

    100%{
        opacity:1;
        transform:
            scale(1)
            translateY(0);

        filter:
            blur(0);
    }
}


/* =========================
   EXIT ANIMATION
========================= */

#entryScreen.exit{

    animation:
        exitScreen
        1s
        forwards;
}


@keyframes exitScreen{

    0%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.15);
        pointer-events:none;
    }
}


/* =========================
   MAIN WEBSITE
========================= */

#mainWebsite{

    display:none;

    width:100%;
    height:100vh;

    overflow:auto;

    background:
        linear-gradient(
            135deg,
            #080b12,
            #15102b
        );

    color:white;

    padding:40px;

    text-align:center;
}


#mainWebsite h1{

    font-size:45px;

    margin-top:80px;

}


#mainWebsite p{

    color:#aab2c5;

    margin-top:15px;

}


/* MOBILE */

@media(max-width:600px){

    .entryPhoto{
        object-position:center top;
    }

    .welcome{
        letter-spacing:4px;
    }

    .subtitle{
        letter-spacing:3px;
    }

    .enterButton{
        margin-top:35px;
    }

}
</style>
</head>

<body>


<!-- ==================================
     ENTRY ANIMATION
================================== -->

<div id="entryScreen">

    <!-- YOUR PHOTO -->

    <img
        src="entry-photo.jpg"
        class="entryPhoto"
        alt="HAZARD 69 Entry"
    >


    <!-- DARK CINEMATIC OVERLAY -->

    <div class="darkOverlay"></div>


    <!-- LIGHT EFFECT -->

    <div class="lightEffect"></div>


    <!-- CONTENT -->

    <div class="entryContent">

        <div class="welcome">
            WELCOME TO
        </div>


        <div class="title">
            HAZARD <span>69</span>
        </div>


        <div class="subtitle">
            OFFICIAL WEBSITE
        </div>


        <button
            class="enterButton"
            onclick="enterWebsite()"
        >
            ENTER WEBSITE
        </button>

    </div>


    <div class="footerText">
        © HAZARD 69 OFFICIAL
    </div>

</div>



<!-- ==================================
     MAIN WEBSITE
================================== -->

<div id="mainWebsite">

    <h1>
        HAZARD 69
    </h1>

    <p>
        Welcome to the Official Website
    </p>

</div>



<script>

function enterWebsite(){

    const entry =
        document.getElementById(
            "entryScreen"
        );

    const website =
        document.getElementById(
            "mainWebsite"
        );


    /* EXIT ANIMATION */

    entry.classList.add("exit");


    /* SHOW WEBSITE */

    setTimeout(function(){

        entry.style.display = "none";

        website.style.display = "block";

        document.body.style.overflow = "auto";

    },1000);

}

</script>

</body>
</html>
