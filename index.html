<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAZARD 69 Official</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#05070d;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
}


/* =====================================================
   ENTRY ANIMATION
===================================================== */

#entryScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    background:#000;
}


/* ENTRY PHOTO */

.entryPhoto{
    position:absolute;
    inset:-5%;

    width:110%;
    height:110%;

    object-fit:cover;
    object-position:center;

    filter:
        brightness(.48)
        contrast(1.2)
        saturate(1.15);

    animation:
        cinematicZoom 9s
        ease-out
        forwards;
}

@keyframes cinematicZoom{

    0%{
        transform:scale(1.08);
    }

    50%{
        transform:scale(1.16);
    }

    100%{
        transform:scale(1.03);
    }
}


/* DARK OVERLAY */

.darkOverlay{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.35) 50%,
            rgba(0,0,0,.9) 100%
        );
}


/* LIGHT EFFECT */

.lightEffect{
    position:absolute;

    width:500px;
    height:500px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(125,70,255,.30),
            transparent 68%
        );

    filter:blur(30px);

    animation:
        lightPulse 3s
        infinite
        ease-in-out;
}

@keyframes lightPulse{

    0%,100%{
        opacity:.45;
        transform:
            translate(-50%,-50%)
            scale(.8);
    }

    50%{
        opacity:.85;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}


/* ENTRY CONTENT */

.entryContent{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    z-index:5;
}


.welcome{
    font-size:13px;

    letter-spacing:7px;

    color:#ddd;

    margin-bottom:15px;

    opacity:0;

    animation:
        fadeUp 1s
        .4s
        forwards;
}


.title{
    font-size:
        clamp(48px,13vw,125px);

    font-weight:1000;

    letter-spacing:
        clamp(5px,2vw,18px);

    color:white;

    text-shadow:
        0 0 15px
        rgba(145,80,255,.9),

        0 0 45px
        rgba(145,80,255,.6),

        0 0 90px
        rgba(145,80,255,.35);

    opacity:0;

    animation:
        titleReveal 1.5s
        .8s
        forwards;
}


.title span{
    color:#8b5cf6;
}


.subtitle{
    margin-top:8px;

    font-size:
        clamp(12px,2vw,18px);

    letter-spacing:6px;

    color:#c5c5c5;

    opacity:0;

    animation:
        fadeUp 1s
        1.4s
        forwards;
}


/* ENTER BUTTON */

.enterButton{
    margin-top:42px;

    min-width:220px;

    padding:16px 30px;

    border-radius:50px;

    border:
        1px solid
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:15px;

    font-weight:bold;

    letter-spacing:3px;

    cursor:pointer;

    backdrop-filter:blur(15px);

    box-shadow:
        0 0 30px
        rgba(123,78,255,.35);

    opacity:0;

    animation:
        fadeUp 1s
        1.9s
        forwards;

    transition:.3s;
}


.enterButton:hover{
    transform:scale(1.06);

    background:
        linear-gradient(
            135deg,
            #6847ff,
            #a855f7
        );

    box-shadow:
        0 0 50px
        rgba(139,92,246,.7);
}


/* ENTRY FOOTER */

.footerText{
    position:absolute;

    bottom:25px;

    font-size:10px;

    letter-spacing:3px;

    color:
        rgba(255,255,255,.5);

    opacity:0;

    animation:
        fadeUp 1s
        2.3s
        forwards;
}


/* ENTRY ANIMATIONS */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


@keyframes titleReveal{

    0%{
        opacity:0;

        transform:
            scale(.7)
            translateY(25px);

        filter:blur(15px);
    }

    100%{
        opacity:1;

        transform:
            scale(1)
            translateY(0);

        filter:blur(0);
    }
}


/* ENTRY EXIT */

#entryScreen.exit{
    animation:
        exitScreen
        1s
        forwards;
}


@keyframes exitScreen{

    0%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.15);
        pointer-events:none;
    }
}


/* =====================================================
   MAIN WEBSITE
===================================================== */

#mainWebsite{
    display:none;

    min-height:100vh;

    overflow:auto;

    background:
        radial-gradient(
            circle at top,
            #21154a,
            #080b12 55%,
            #05070d
        );

    color:white;

    padding-bottom:80px;
}


/* HEADER */

.header{
    position:sticky;

    top:0;

    z-index:100;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    background:
        rgba(5,7,13,.82);

    border-bottom:
        1px solid
        #202638;

    backdrop-filter:blur(18px);
}


.logo{
    font-size:21px;

    font-weight:900;

    letter-spacing:2px;
}


.logo span{
    color:#8b5cf6;
}


.menuButton{
    padding:10px 16px;

    border:0;

    border-radius:12px;

    background:#181e2d;

    color:white;

    cursor:pointer;
}


/* MAIN CONTENT */

.content{
    max-width:1100px;

    margin:auto;

    padding:
        50px 20px;
}


.heroTitle{
    text-align:center;

    font-size:
        clamp(35px,7vw,70px);

    font-weight:900;

    text-shadow:
        0 0 35px
        rgba(139,92,246,.5);
}


.heroSubtitle{
    text-align:center;

    color:#9fa9bd;

    margin-top:12px;

    letter-spacing:3px;
}


/* =====================================================
   PROFESSIONAL PHOTO CARD
===================================================== */

.photo-section{
    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:60px 20px;
}


.photo-card{
    position:relative;

    width:
        min(90vw,600px);

    border-radius:30px;

    overflow:hidden;

    background:#101522;

    border:
        1px solid
        rgba(255,255,255,.15);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.6);

    transform:translateY(0);

    transition:
        transform .4s ease,
        box-shadow .4s ease;
}


.photo-card:hover{
    transform:
        translateY(-10px)
        scale(1.02);

    box-shadow:
        0 40px 100px
        rgba(125,70,255,.35);
}


/* PHOTO */

.website-photo{
    display:block;

    width:100%;

    height:auto;

    min-height:400px;

    object-fit:cover;

    object-position:center;

    filter:
        brightness(.8)
        contrast(1.1)
        saturate(1.1);

    transition:
        transform .8s ease,
        filter .5s ease;
}


.photo-card:hover .website-photo{
    transform:scale(1.06);

    filter:
        brightness(.95)
        contrast(1.15)
        saturate(1.2);
}


/* PHOTO PURPLE GLOW */

.photo-glow{
    position:absolute;

    width:250px;
    height:250px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(139,92,246,.35),
            transparent 70%
        );

    filter:blur(35px);

    pointer-events:none;

    z-index:2;
}


/* PHOTO TEXT */

.photo-overlay{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:3;

    padding:
        70px 25px 25px;

    text-align:center;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.92)
        );
}


.photo-overlay h2{
    margin:0;

    color:white;

    font-size:
        clamp(28px,6vw,45px);

    font-weight:900;

    letter-spacing:5px;

    text-shadow:
        0 0 20px
        rgba(139,92,246,.8);
}


.photo-overlay p{
    margin-top:7px;

    color:#c5b5ff;

    font-size:12px;

    letter-spacing:6px;
}


/* =====================================================
   INFO CARDS
===================================================== */

.infoGrid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:20px;

    margin-top:30px;
}


.infoCard{
    padding:25px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #151b2a,
            #0b101a
        );

    border:
        1px solid
        #252e43;

    text-align:center;
}


.infoCard .icon{
    font-size:40px;

    margin-bottom:12px;
}


.infoCard h3{
    margin-bottom:8px;
}


.infoCard p{
    color:#9ca7bb;

    line-height:1.5;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    text-align:center;

    padding:30px 20px;

    color:#6f798c;

    font-size:12px;

    letter-spacing:2px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .entryPhoto{
        object-position:center top;
    }

    .welcome{
        letter-spacing:4px;
    }

    .subtitle{
        letter-spacing:3px;
    }

    .enterButton{
        margin-top:35px;
    }

    .header{
        padding:0 15px;
    }

    .content{
        padding:
            35px 15px;
    }

    .photo-section{
        padding:
            40px 0;
    }

    .photo-card{
        width:100%;

        border-radius:22px;
    }

    .website-photo{
        min-height:350px;
    }

    .photo-overlay h2{
        letter-spacing:3px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     ENTRY ANIMATION
===================================================== -->

<div id="entryScreen">


    <!-- তোমার পাঠানো ছবি -->

    <img
        src="photo.jpg"
        class="entryPhoto"
        alt="HAZARD 69 Entry"
    >


    <div class="darkOverlay"></div>

    <div class="lightEffect"></div>


    <div class="entryContent">

        <div class="welcome">
            WELCOME TO
        </div>


        <div class="title">
            HAZARD <span>69</span>
        </div>


        <div class="subtitle">
            OFFICIAL WEBSITE
        </div>


        <button
            class="enterButton"
            onclick="enterWebsite()"
        >
            ENTER WEBSITE
        </button>

    </div>


    <div class="footerText">
        © HAZARD 69 OFFICIAL
    </div>

</div>



<!-- =====================================================
     MAIN WEBSITE
===================================================== -->

<div id="mainWebsite">


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            HAZARD <span>69</span>
        </div>

        <button
            class="menuButton"
            onclick="window.scrollTo({
                top:0,
                behavior:'smooth'
            })"
        >
            HOME
        </button>

    </header>



    <!-- CONTENT -->

    <main class="content">


        <h1 class="heroTitle">
            HAZARD 69
        </h1>


        <p class="heroSubtitle">
            OFFICIAL WEBSITE
        </p>



        <!-- =================================================
             PHOTO
        ================================================== -->

        <section class="photo-section">

            <div class="photo-card">


                <!-- PURPLE GLOW -->

                <div class="photo-glow"></div>


                <!-- PHOTO -->

                <img
                    src="photo.jpg"
                    alt="HAZARD 69"
                    class="website-photo"
                >


                <!-- PHOTO TEXT -->

                <div class="photo-overlay">

                    <h2>
                        HAZARD 69
                    </h2>

                    <p>
                        OFFICIAL
                    </p>

                </div>

            </div>

        </section>



        <!-- =================================================
             INFO
        ================================================== -->

        <div class="infoGrid">


            <div class="infoCard">

                <div class="icon">
                    ⚡
                </div>

                <h3>
                    HAZARD 69
                </h3>

                <p>
                    Official website and
                    digital platform.
                </p>

            </div>



            <div class="infoCard">

                <div class="icon">
                    🎵
                </div>

                <h3>
                    MUSIC
                </h3>

                <p>
                    Music, updates and
                    entertainment.
                </p>

            </div>



            <div class="infoCard">

                <div class="icon">
                    🌐
                </div>

                <h3>
                    SOCIAL
                </h3>

                <p>
                    Connect with HAZARD 69
                    online.
                </p>

            </div>


        </div>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        © 2026 HAZARD 69 OFFICIAL

    </footer>


</div>



<script>

/* =====================================================
   ENTER WEBSITE
===================================================== */

function enterWebsite(){

    const entry =
        document.getElementById(
            "entryScreen"
        );

    const website =
        document.getElementById(
            "mainWebsite"
        );


    /* EXIT ANIMATION */

    entry.classList.add("exit");


    /* SHOW MAIN WEBSITE */

    setTimeout(function(){

        entry.style.display = "none";

        website.style.display = "block";

        document.body.style.overflow = "auto";

        window.scrollTo(0,0);

    },1000);

}

</script>

</body>
</html>
