<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAZARD 69 OFFICIAL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#24105c 0%,#080812 45%,#020205 100%);
    font-family:Arial,sans-serif;
    color:white;
    overflow-x:hidden;
}

.container{
    width:92%;
    max-width:430px;
    padding:30px 22px;
    text-align:center;

    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.6),
        0 0 35px rgba(124,60,255,.35);

    backdrop-filter:blur(15px);
    transform:perspective(1000px) rotateX(2deg);
}

/* Logo */
.logo{
    width:105px;
    height:105px;
    margin:auto;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#7c3cff,#ff2d75,#ff9a00);

    box-shadow:
        0 0 20px #7c3cff,
        0 0 45px rgba(255,45,117,.5);

    font-size:35px;
    font-weight:bold;

    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

h1{
    margin-top:22px;
    font-size:29px;
    letter-spacing:2px;

    background:linear-gradient(90deg,#fff,#00e5ff,#c77dff,#fff);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:8px;
    color:#aaa;
}

/* Instagram */
.instagram{
    margin-top:25px;
    padding:15px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    border-radius:18px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);

    text-decoration:none;
    color:white;

    transition:.3s;
}

.instagram:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 0 25px rgba(255,45,117,.45);
}

.insta-icon{
    width:38px;
    height:38px;
    border-radius:11px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;
    font-weight:bold;

    background:linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
}

.username{
    font-size:17px;
    font-weight:bold;
}

/* Photo Button */
.photo-btn{
    display:block;
    margin-top:18px;
    padding:15px;

    border-radius:18px;

    background:linear-gradient(
        135deg,
        #7c3cff,
        #00bfff
    );

    color:white;
    text-decoration:none;

    font-size:17px;
    font-weight:bold;

    box-shadow:
        0 8px 25px rgba(0,191,255,.25);

    transition:.3s;
}

.photo-btn:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:
        0 0 30px rgba(124,60,255,.7);
}

/* Photo */
.photo{
    display:none;
    margin-top:20px;
}

.photo img{
    width:100%;
    max-height:300px;
    object-fit:cover;

    border-radius:20px;

    border:2px solid rgba(255,255,255,.2);

    box-shadow:
        0 0 30px rgba(124,60,255,.4);
}

.footer{
    margin-top:25px;
    font-size:12px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

    <!-- Logo -->
    <div class="logo">
        H69
    </div>

    <h1>HAZARD 69 OFFICIAL</h1>

    <p class="subtitle">
        Official Website
    </p>

    <!-- Instagram -->
    <a
        class="instagram"
        href="https://instagram.com/hazard69official"
        target="_blank"
    >

        <div class="insta-icon">
            ◎
        </div>

        <div class="username">
            @hazard69official
        </div>

    </a>

    <!-- Photo Button -->
    <a
        href="javascript:void(0)"
        class="photo-btn"
        onclick="showPhoto()"
    >
        📸 VIEW PHOTO
    </a>

    <!-- Photo -->
    <div class="photo" id="photo">

        <img
            src="YOUR_PHOTO_URL_HERE"
            alt="HAZARD 69 PHOTO"
        >

    </div>

    <div class="footer">
        © 2026 HAZARD 69 OFFICIAL
    </div>

</div>

<script>

function showPhoto(){

    const photo = document.getElementById("photo");

    if(photo.style.display === "block"){
        photo.style.display = "none";
    }else{
        photo.style.display = "block";
    }

}

</script>

</body>
</html>
