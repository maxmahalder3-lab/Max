<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAZARD 69 — OFFICIAL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:white;
    overflow-x:hidden;
}

/* Animated Background */
.background{
    position:fixed;
    inset:0;
    z-index:-3;

    background:
        linear-gradient(120deg,rgba(0,0,0,.85),rgba(10,10,10,.45)),
        url("bg.jpg");

    background-size:cover;
    background-position:center;

    animation:zoom 18s infinite alternate ease-in-out;
}

@keyframes zoom{
    from{transform:scale(1);}
    to{transform:scale(1.08);}
}

/* Glow */
.glow{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(255,0,0,.18);
    filter:blur(100px);
    top:10%;
    left:10%;
    z-index:-2;
}

/* Navbar */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.35);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.08);
    z-index:20;
}

.brand{
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 0 15px red;
}

.nav-btn{
    padding:10px 18px;
    border:1px solid rgba(255,0,0,.5);
    border-radius:30px;
    color:white;
    text-decoration:none;
    font-size:13px;
    transition:.3s;
}

.nav-btn:hover{
    background:red;
    box-shadow:0 0 25px red;
}

/* Hero */
.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:100px 20px 40px;
}

.content{
    max-width:850px;
}

/* Logo */
.logo{
    width:180px;
    max-width:55vw;

    filter:
        drop-shadow(0 0 15px rgba(255,0,0,.8))
        drop-shadow(0 0 45px rgba(255,0,0,.4));

    animation:
        float 4s ease-in-out infinite,
        logoGlow 2s infinite alternate;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes logoGlow{
    from{
        filter:drop-shadow(0 0 10px red);
    }
    to{
        filter:drop-shadow(0 0 35px red);
    }
}

.subtitle{
    margin-top:25px;
    font-size:14px;
    letter-spacing:7px;
    color:#aaa;
}

.title{
    margin-top:12px;
    font-size:clamp(45px,10vw,95px);
    font-weight:1000;
    letter-spacing:8px;

    background:linear-gradient(
        180deg,
        #fff,
        #ff3030,
        #650000
    );

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:0 0 30px rgba(255,0,0,.3);
}

/* Enter Button */
.enter{
    display:inline-flex;
    margin-top:35px;
    padding:17px 45px;

    color:white;
    text-decoration:none;

    font-weight:bold;
    letter-spacing:3px;

    border:1px solid rgba(255,0,0,.7);
    border-radius:50px;

    background:rgba(255,0,0,.08);
    backdrop-filter:blur(10px);

    box-shadow:
        0 0 15px rgba(255,0,0,.25),
        inset 0 0 20px rgba(255,0,0,.05);

    transition:.35s;
}

.enter:hover{
    transform:translateY(-4px) scale(1.04);
    background:#e60000;
    box-shadow:
        0 0 20px red,
        0 0 60px rgba(255,0,0,.5);
}

/* Cards */
.cards{
    margin-top:55px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.card{
    width:170px;
    padding:22px 15px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;

    backdrop-filter:blur(15px);

    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:rgba(255,0,0,.6);
    box-shadow:0 10px 35px rgba(255,0,0,.2);
}

.card-icon{
    font-size:28px;
    margin-bottom:10px;
}

.card h3{
    font-size:14px;
    letter-spacing:1px;
}

.card p{
    margin-top:6px;
    font-size:11px;
    color:#999;
}

/* Social */
.social{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:12px;
}

.social a{
    width:45px;
    height:45px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    color:white;
    text-decoration:none;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);

    transition:.3s;
}

.social a:hover{
    background:red;
    transform:translateY(-5px);
    box-shadow:0 0 25px red;
}

/* Music Button */
.music{
    position:fixed;
    right:20px;
    bottom:20px;

    width:55px;
    height:55px;

    border-radius:50%;
    border:1px solid rgba(255,0,0,.6);

    background:rgba(0,0,0,.6);
    color:white;

    cursor:pointer;

    backdrop-filter:blur(15px);

    box-shadow:0 0 20px rgba(255,0,0,.25);

    z-index:50;
}

.music:hover{
    background:red;
    box-shadow:0 0 30px red;
}

/* Footer */
footer{
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;

    color:#777;
    font-size:10px;
    letter-spacing:2px;
}

/* Mobile */
@media(max-width:600px){

    nav{
        padding:15px 5%;
    }

    .brand{
        font-size:17px;
    }

    .nav-btn{
        padding:8px 13px;
        font-size:11px;
    }

    .logo{
        width:145px;
    }

    .subtitle{
        font-size:10px;
        letter-spacing:4px;
    }

    .title{
        letter-spacing:4px;
    }

    .card{
        width:145px;
        padding:18px 10px;
    }

    .enter{
        padding:15px 35px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="glow"></div>

<nav>
    <div class="brand">HAZARD 69</div>

    <a href="#official" class="nav-btn">
        OFFICIAL
    </a>
</nav>

<section class="hero" id="official">

    <div class="content">

        <!-- YOUR LOGO -->
        <img src="logo.png" class="logo" alt="HAZARD 69 Logo">

        <div class="subtitle">
            WELCOME TO THE
        </div>

        <div class="title">
            HAZARD 69
        </div>

        <p style="color:#aaa;font-size:13px;margin-top:10px;">
            OFFICIAL DIGITAL EXPERIENCE
        </p>

        <a href="#" class="enter">
            ENTER WEBSITE
        </a>

        <div class="cards">

            <div class="card">
                <div class="card-icon">⚡</div>
                <h3>OFFICIAL</h3>
                <p>Official HAZARD 69 website</p>
            </div>

            <div class="card">
                <div class="card-icon">🔥</div>
                <h3>PREMIUM</h3>
                <p>Exclusive digital experience</p>
            </div>

            <div class="card">
                <div class="card-icon">🌐</div>
                <h3>CONNECT</h3>
                <p>Follow us online</p>
            </div>

        </div>

        <!-- SOCIAL LINKS -->
        <div class="social">

            <a href="https://www.instagram.com/hazard_69_official/"
               target="_blank">IG</a>

            <a href="#" target="_blank">YT</a>

            <a href="#" target="_blank">TG</a>

        </div>

    </div>

</section>

<footer>
    © 2026 HAZARD 69 • OFFICIAL WEBSITE
</footer>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()" id="musicBtn">
    🔇
</button>

<script>

const music = document.getElementById("music");
const btn = document.getElementById("musicBtn");

/* Try autoplay */
window.addEventListener("load",()=>{
    music.volume = 0.35;

    music.play().then(()=>{
        btn.innerHTML="🔊";
    }).catch(()=>{
        btn.innerHTML="🔇";
    });
});

/* Music toggle */
function toggleMusic(){

    if(music.paused){
        music.play();
        btn.innerHTML="🔊";
    }else{
        music.pause();
        btn.innerHTML="🔇";
    }

}

</script>

</body>
</html>
